<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maxime Périgny - Site en maintenance</title>
  <meta name="description" content="Le portfolio de Maxime Périgny, vidéaste et photographe, revient bientôt.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17150f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --ink: #17150f;
      --paper: #f4f1ea;
      --accent: #e08a6d;
      --rec: #d9452b;
      --line: rgba(244, 241, 234, 0.15);
      --muted: rgba(244, 241, 234, 0.5);
      --body: rgba(244, 241, 234, 0.72);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--ink); color: var(--paper); font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; transition: color .25s, border-color .25s; }
    a:hover { color: var(--accent); }
    ::selection { background: var(--accent); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .page { min-height: 100%; display: flex; flex-direction: column; padding: 24px 56px 40px; }

    .hd { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .name { font-family: 'Instrument Serif', serif; font-size: 22px; letter-spacing: 0.01em; }
    .status {
      display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .2 } }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px 0; }
    .label {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 24px;
    }
    h1 {
      font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(48px, 8vw, 120px);
      line-height: 0.94; letter-spacing: -0.02em; margin: 0; max-width: 12em; text-wrap: balance;
    }
    h1 em { font-style: italic; color: var(--accent); }
    .scribble {
      font-family: 'Caveat', cursive; font-size: 24px; color: var(--accent); margin: 28px 0 0;
      transform: rotate(-2deg); transform-origin: left;
    }
    .lede { font-size: 16px; line-height: 1.7; color: var(--body); margin: 32px 0 28px; max-width: 460px; }
    .mail {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      border-bottom: 1px solid var(--paper); padding-bottom: 4px;
    }
    .mail:hover { border-color: var(--accent); }

    .ft {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      border-top: 1px solid var(--line); padding-top: 20px;
      font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted);
    }
    .ft a:hover { color: var(--paper); }

    @media (max-width: 820px) {
      .page { padding: 18px 20px 28px; }
      main { padding: 48px 0; }
      h1 { font-size: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rec { animation: none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="hd">
      <span class="name">Maxime Périgny</span>
      <span class="status"><span class="rec" aria-hidden="true"></span>En montage</span>
    </header>

    <main>
      <p class="label">Vidéaste · photographe</p>
      <h1>Le site est en <em>salle de montage.</em></h1>
      <p class="scribble">de retour très bientôt</p>
      <p class="lede">Je refais mon portfolio de A à Z. En attendant, pour un tournage, une photo ou une question,
        écris-moi directement.</p>
      <a class="mail" href="mailto:maxime.perigny.50@gmail.com">maxime.perigny.50@gmail.com <span>→</span></a>
    </main>

    <footer class="ft">
      <span>© 2026 Maxime Périgny</span>
      <a href="https://www.linkedin.com/in/maxime-périgny-69b9b31ba/" target="_blank" rel="noopener">LinkedIn</a>
    </footer>
  </div>
</body>

</html>
